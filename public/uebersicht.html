<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Übersicht – Zeiterfassung</title>
<link rel="stylesheet" href="/css/fonts.css" />
<link rel="stylesheet" href="/css/styles.css" />
<script src="/js/theme.js"></script>
</head>
<body>

<div class="topbar">
  <div class="topbar__brand"><span class="mark"></span><strong>Zeiterfassung</strong></div>
  <div class="topbar__nav">
    <a href="/index.html"><span class="label">Erfassung</span></a>
    <a href="/uebersicht.html" class="active"><span class="label">Übersicht</span></a>
    <a href="/wochenbericht.html" id="weeklyNavLink" class="hidden"><span class="label">Wochenbericht</span></a>
    <a href="/account.html"><span class="label">Konto</span></a>
    <a href="/admin.html" id="adminNavLink" class="hidden"><span class="label">Team</span></a>
  </div>
  <div class="topbar__user">
    <span id="userLabel"></span>
    <button class="btn btn--ghost btn--sm" id="logoutBtn">Abmelden</button>
  </div>
</div>

<div class="shell shell--wide">
  <div class="stack">

    <div class="page-head">
      <div>
        <div class="eyebrow" id="rangeEyebrow"></div>
        <h1 class="page-title" id="rangeLabel"></h1>
      </div>
      <div class="page-head__actions">
        <div class="seg" role="group" aria-label="Zeitraum">
          <button type="button" class="seg__btn is-active" id="weekModeBtn">Woche</button>
          <button type="button" class="seg__btn" id="monthModeBtn">Monat</button>
        </div>
        <button type="button" class="btn btn--secondary btn--nav" id="prevBtn" title="Zurück" aria-label="Zurück">&larr;</button>
        <button type="button" class="btn btn--secondary" id="todayBtn">Heute</button>
        <button type="button" class="btn btn--secondary btn--nav" id="nextBtn" title="Vor" aria-label="Vor">&rarr;</button>
      </div>
    </div>

    <div id="rangeError"></div>

    <div class="stat-row">
      <div class="stat">
        <span class="stat__label">Gesamt</span>
        <strong class="stat__value mono" id="statTotal">–</strong>
      </div>
      <div class="stat">
        <span class="stat__label">Noch nicht in Jira</span>
        <strong class="stat__value mono" id="statOpen">–</strong>
      </div>
      <div class="stat">
        <span class="stat__label">Erfasste Tage</span>
        <strong class="stat__value mono" id="statDays">–</strong>
      </div>
      <div class="stat">
        <span class="stat__label">Ø pro erfasstem Tag</span>
        <strong class="stat__value mono" id="statAvg">–</strong>
      </div>
    </div>

    <div class="page-grid">
      <section class="card page-main" aria-label="Tage">
        <h2>Tage</h2>
        <div id="dayBars"></div>
      </section>

      <section class="card page-side" aria-label="Nach Ticket">
        <div class="card__header">
          <h2>Nach Ticket</h2>
          <button type="button" class="btn btn--secondary btn--sm" id="copyJiraBtn">Zusammenfassung kopieren</button>
        </div>
        <div id="jiraList"></div>
      </section>
    </div>

    <section class="card card--flush" aria-label="Alle Einträge">
      <div class="list-head">
        <h2>Alle Einträge <span class="list-head__count" id="entriesCount"></span></h2>
        <div class="list-head__tools">
          <label class="check-inline"><input type="checkbox" id="onlyOpenToggle" /><span>Nur noch nicht in Jira</span></label>
          <div class="sort-control">
            <label for="sortSelect">Sortierung</label>
            <select id="sortSelect">
              <option value="time-asc">Älteste zuerst</option>
              <option value="time-desc">Neueste zuerst</option>
              <option value="duration-desc">Längste zuerst</option>
              <option value="ticket">Nach Ticket</option>
            </select>
          </div>
          <button type="button" class="btn btn--secondary btn--sm" id="csvBtn">Als CSV speichern</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Datum</th><th>Zeit</th><th>Dauer</th><th>Aufgabe</th><th>Ticket</th><th>Jira</th></tr>
          </thead>
          <tbody id="entriesTableBody"></tbody>
        </table>
      </div>
    </section>

  </div>
</div>

<script src="/js/util.js"></script>
<script src="/js/api.js"></script>
<script src="/js/update.js"></script>
<script src="/js/overview.js"></script>
</body>
</html>
